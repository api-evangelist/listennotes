        id:
          $ref: '#/components/schemas/PodcastIdField'
        country:
          $ref: '#/components/schemas/CountryField'
        publisher:
          $ref: '#/components/schemas/PublisherField'
        itunes_id:
          $ref: '#/components/schemas/iTunesIdField'
        looking_for:
          $ref: '#/components/schemas/PodcastLookingForField'
        extra:
