  source:
  - https://github.com/api-evangelist/listennotes/issues/1
  request: 'Issue #1 (wenbinf, Listen Notes founder), verified live 2026-10-02. Keep this as the ONE Listen Notes provider (aid listennotes); do NOT create a separate PodcastAPI.com provider - podcastapi.com is Listen Notes'' official API site for the same Listen API v2. All of these return 200 (invented paths on podcastapi.com return a real 404): APIs.json https://www.podcastapi.com/apis.json and /.well-known/apis.json (aid podcastapi.com:apis, one API listennotes.com:podcast-api, baseURL https://listen-api.listennotes.com/api/v2); RFC 9727 api-catalog https://www.podcastapi.com/.well-known/api-catalog (linkset; service-desc -> openapi.json, service-meta -> apis.json); OpenAPI https://listen-api.listennotes.com/api/v2/openapi.json and openapi.yaml (OpenAPI 3.1.0, ''Listen API: Podcast Search, Directory, and Insights API'' v2.0, 27 paths, tags Search API, Directory API, Playlist API, Podcaster API, Insights API); llms.txt and llms-full.txt at https://www.podcastapi.com/; official agent skills repo https://github.com/PodcastAPI/skills (skills/, evals/, .claude-plugin). Re-pull openapi/ from the official openapi.yaml/json URL (record the source URL on each derived file), regenerate collections from it, add APIs.json / api-catalog / llms.txt / skills pointers. Fix the doubled names: the per-tag split produced titles and slugs like ''Directory API API'' (listennotes-directory-api-api-*); the five groups are tags of one Listen API v2 spec, so either model it as one API or name the splits without the repeated ''API''. Supporting links (all 200): https://www.listennotes.com/api/, /api/docs/, /api/pricing/.'
